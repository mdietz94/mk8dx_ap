# MK8DX 4.0.0 symbols used by the mod (main build id 2C336A9BCF79C304...).
#
# Each entry is located in one of two ways:
#   address           - main-relative address on 4.0.0, published in the
#                       commented ASM of RoGamer97/ASM-Cheats-and-Patches
#                       (Switch/Mario Kart 8 Deluxe/4.0.0/*/source.s). Used
#                       as-is; if a pattern is also present it is only
#                       cross-checked and logged.
#   pattern / offset  - for functions with no published 4.0.0 address.
#                       IDA-style byte pattern scanned over main .text at
#                       instruction alignment; address = match + offset.
#                       Pattern data comes from fishguy6564/MK8DX-Base-Plugin
#                       symbols.toml, which was authored against 3.0.5. If the
#                       exact bytes miss, a RELAXED form is tried (branch
#                       distances, ADRP pages and struct-offset immediates
#                       wildcarded) and accepted only on a unique match. That
#                       is the porting method Ro demonstrates in "Porting MK8D
#                       patches to v4.0.0".
#
# Offsets are quoted strings because TOML has no negative hex literals.
# Run `python scripts/gen_symbol_table.py` after editing to regenerate
# switch-mod/src/sym/SymbolTable.inc (committed; a test checks freshness).

