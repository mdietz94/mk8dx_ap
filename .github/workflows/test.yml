name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize Archipelago submodule
        run: git submodule update --init --depth 1 vendor/Archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Archipelago deps (headless subset)
        run: |
          python -m pip install --upgrade pip wheel
          grep -Ev '^(kivy|kivymd|pyshortcuts|Pymem)' vendor/Archipelago/requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install pytest pytest-asyncio
      - name: Install apworld zip
        run: python scripts/install_apworld.py
      - name: Run pytest
        run: python -m pytest -v apworld/mk8dx_archipelago/tests/

  python-live-ap:
    name: AP generation sweep
    runs-on: ubuntu-latest
    needs: python-unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize Archipelago submodule
        run: git submodule update --init --depth 1 vendor/Archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Archipelago deps (headless subset)
        run: |
          python -m pip install --upgrade pip wheel
          grep -Ev '^(kivy|kivymd|pyshortcuts|Pymem)' vendor/Archipelago/requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install pytest pytest-asyncio
      - name: Install apworld zip
        run: python scripts/install_apworld.py
      - name: Run generation tests
        env:
          MK8AP_LIVE_AP: '1'
        run: python -m pytest -v apworld/mk8dx_archipelago/tests/test_apworld_generation.py

  cpp-host:
    name: Switch-mod host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build + run test_json
        run: |
          g++ -std=c++20 -Wall -Wextra -O0 -g -DMK8AP_HOST_TEST \
            switch-mod/tests/test_json.cpp switch-mod/src/util/Json.cpp -Iswitch-mod/src -o test_json
          ./test_json
      - name: Build + run test_protocol
        run: |
          g++ -std=c++20 -Wall -Wextra -O0 -g -DMK8AP_HOST_TEST \
            switch-mod/tests/test_protocol.cpp switch-mod/src/ap/ApProtocol.cpp \
            switch-mod/src/util/Json.cpp -Iswitch-mod/src -o test_protocol
          ./test_protocol
      - name: Build + run test_pattern
        run: |
          g++ -std=c++20 -Wall -Wextra -O0 -g -DMK8AP_HOST_TEST \
            switch-mod/tests/test_pattern.cpp switch-mod/src/sym/PatternResolver.cpp \
            -Iswitch-mod/src -o test_pattern
          ./test_pattern
      - name: Symbol table freshness
        run: python3 scripts/gen_symbol_table.py --check
